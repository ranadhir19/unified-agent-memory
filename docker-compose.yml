services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/unifiedmemory
    volumes:
      - neo4j-data:/data

  api:
    build: .
    command: uam-serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: unifiedmemory
    depends_on:
      - neo4j

volumes:
  neo4j-data:
