[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-agent-memory"
version = "0.1.0"
description = "A harness-agnostic agentic memory layer in Neo4j, fed by lifecycle hooks from Claude Code, Codex and Cursor plus adapters to third-party data sources (GitHub, files, RSS, Slack)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["agents", "memory", "neo4j", "hooks", "mcp", "claude-code", "codex", "cursor"]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
neo4j = ["neo4j>=5"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "strawberry-graphql[fastapi]>=0.235"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
uam-hook = "unified_agent_memory.hooks:main"
uam-dream = "unified_agent_memory.cli:dream_main"
uam-config = "unified_agent_memory.cli:config_main"
uam-ingest = "unified_agent_memory.cli:ingest_main"
uam-simulate = "unified_agent_memory.cli:simulate_main"
uam-serve = "unified_agent_memory.cli:serve_main"
uam-mcp = "unified_agent_memory.mcp_server:main"
uam-export-cursor-rules = "unified_agent_memory.cli:export_cursor_rules_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
